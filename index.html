<meta property="og:title" content="Metal Kings"><meta property="og:type" content="website">
<meta property="og:description" content="We design and deliver pre-engineered building solutions tailored to your operational needs, efficient, durable, and built to last.">

<style>
:root{--ink:#0a0a0a;--bg:#fff;--g1:#f3f3f3;--g2:#dcdcdc;--mute:#626262;--acc:#c9a14a;--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--body);overflow-x:hidden}
a{color:inherit}img{max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--acc);padding:.6rem 1rem;z-index:99}.skip:focus{left:0}
.c{max-width:1200px;margin:0 auto;padding:0 clamp(1.1rem,4vw,2.5rem)}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;margin:0;line-height:.98;font-weight:800}
.nv{position:fixed;inset:0 0 auto;z-index:50;color:#fff;padding:1.2rem 0;transition:background .35s,padding .35s}
.nv.s{background:rgba(10,10,10,.92);backdrop-filter:blur(10px);padding:.7rem 0}
.nv .c{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:.6rem;font:800 1.6rem/1 var(--disp);letter-spacing:.06em;text-decoration:none}
.logo i{width:1rem;height:1rem;background:var(--acc);clip-path:polygon(0 100%,50% 0,100% 100%)}
.nv ul{display:flex;gap:2rem;list-style:none;margin:0;padding:0;align-items:center}
.nv a.l{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:.4rem 0;border-bottom:2px solid transparent}
.nv a.l:hover,.nv a.l.on{border-color:var(--acc)}
.bt{display:inline-block;background:var(--acc);color:#0a0a0a;font:600 .78rem var(--body);letter-spacing:.14em;text-transform:uppercase;padding:.95rem 1.9rem;text-decoration:none;border:1px solid var(--acc);cursor:pointer;transition:transform .2s,background .2s,color .2s}
.bt:hover{transform:translateY(-2px)}
.bt.o{background:transparent;color:inherit;border-color:currentColor}.bt.o:hover{background:#fff;color:#0a0a0a}
.bt.k{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.nv .bt{padding:.6rem 1.2rem}
.mb{display:none;background:none;border:0;color:#fff;font-size:1.7rem;cursor:pointer;line-height:1}
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;color:#fff;background:#0a0a0a;overflow:hidden;padding:7rem 0 12vw;clip-path:polygon(0 0,100% 0,100% calc(100% - clamp(30px,6vw,90px)),0 100%)}
.hero .scene,.hero .hb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene{transform:translateY(var(--py,0px)) scale(1.08)}
.hero .ov{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.3) 50%,rgba(0,0,0,.7))}
.hero .in{position:relative;z-index:2}
.eye{font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;margin:0 0 1.2rem;color:#ddd}
.hero h1{font-size:clamp(2.7rem,8vw,6.6rem);letter-spacing:.03em}
.sub{max-width:52ch;margin:1.5rem auto 0;color:#d2d2d2;font-size:1.1rem}
.cta{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:2.2rem}
.pc{display:inline-block;margin-top:2rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#cfcfcf;text-decoration:none;border-bottom:1px solid #666}
.cue{position:absolute;left:50%;bottom:clamp(60px,9vw,120px);width:1px;height:56px;background:rgba(255,255,255,.3);overflow:hidden;z-index:3}
.cue::after{content:"";position:absolute;inset:0;background:var(--acc);animation:cue 2s ease-in-out infinite}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.wd i{display:inline-block;font-style:normal;transform:translateY(110%);animation:rise .9s cubic-bezier(.2,.7,.1,1) forwards;animation-delay:calc(var(--i)*.1s + .1s)}
.hero .eye,.hero .sub,.hero .cta,.hero .pc{animation:up .9s .7s cubic-bezier(.2,.7,.1,1) backwards}
.hook{transform-origin:1100px 200px;animation:sway 7s ease-in-out infinite alternate}
.sp{fill:#c9a14a;opacity:0;animation:float 7s linear infinite;animation-delay:var(--d)}
@keyframes rise{to{transform:none}}@keyframes up{from{opacity:0;transform:translateY(26px)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes float{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-260px)}}
@keyframes cue{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes mq{to{transform:translateX(-50%)}}@keyframes fi{from{opacity:0}}
.pg{animation:fi .5s}
.ph{position:relative;color:#fff;text-align:center;padding:9rem 0 8rem;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/56px 56px,#0a0a0a;clip-path:polygon(0 0,100% 0,100% calc(100% - clamp(24px,5vw,70px)),0 100%)}
.ph h1{font-size:clamp(2.4rem,6vw,4.8rem);letter-spacing:.03em;max-width:18ch;margin:0 auto}
.ph p{color:#c8c8c8;max-width:56ch;margin:1.1rem auto 0}
.sec{padding:clamp(3.5rem,9vw,7rem) 0}
.lbl{display:flex;align-items:center;gap:.8rem;font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin:0 0 1rem}
.lbl::before{content:"";width:34px;height:2px;background:var(--acc)}
.h2{font-size:clamp(2rem,4.6vw,3.6rem);letter-spacing:.015em}
.h2::after{content:"";display:block;width:56px;height:4px;background:var(--acc);margin-top:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.5rem;text-align:center;padding:2.5rem 0}
.stats b{display:block;font:800 clamp(2.6rem,5vw,3.8rem)/1 var(--disp)}.stats span{color:var(--mute);font-size:.9rem}
.mq{border-block:1px solid var(--g2);overflow:hidden;padding:1.2rem 0}
.mq>div{display:flex;width:max-content;animation:mq 45s linear infinite}.mq:hover>div{animation-play-state:paused}
.mq span{font:800 clamp(1.7rem,3.6vw,2.7rem)/1 var(--disp);text-transform:uppercase;white-space:nowrap;display:flex;align-items:center}
.mq span::after{content:"";width:.4em;height:.4em;background:var(--ink);margin:0 1.8rem;transform:rotate(45deg)}
.mq span.o{color:transparent;-webkit-text-stroke:1px var(--ink)}
.two{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(2rem,6vw,5rem);align-items:center}
.lead{font-size:1.2rem;line-height:1.55;margin:1.6rem 0}
.pr{list-style:none;margin:2rem 0 0;padding:0;border-top:1px solid var(--g2)}
.pr li{display:flex;gap:1.2rem;align-items:baseline;padding:1rem 0;border-bottom:1px solid var(--g2);font-weight:500;transition:padding .3s}
.pr li:hover{padding-left:.8rem}.pr b{font:800 1.4rem var(--disp);color:var(--acc)}
.dk{background:var(--ink);color:#fff;clip-path:polygon(0 clamp(24px,4vw,60px),100% 0,100% calc(100% - clamp(24px,4vw,60px)),0 100%);padding-block:clamp(5rem,10vw,8rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1.5rem}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff;border:1px solid var(--g2);text-decoration:none;color:var(--ink);transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:var(--acc)}
.dk .card{background:#121212;border-color:#2a2a2a;color:#fff}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(201,161,74,.16),transparent 65%)}
.card:hover::after{opacity:1}
.vs{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0f1419;color:#5d6b78;border-bottom:3px solid var(--acc)}
.vs .bp{position:absolute;inset:auto 1rem 0;width:calc(100% - 2rem);height:70%}
.vs .bp use{stroke:currentColor;fill:none}
.vs .st{position:absolute;right:1rem;top:.4rem;font:800 4.2rem/1 var(--disp);color:transparent;-webkit-text-stroke:1px #6b7a88}
.vs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.card:hover .vs img{transform:scale(1.07)}
.cb{padding:1.3rem;display:flex;flex-direction:column;flex:1}
.cb h3{font-size:1.5rem;margin-bottom:.6rem;letter-spacing:.01em}
.mt{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;color:var(--mute);border-bottom:1px solid var(--g2);padding-bottom:.7rem;margin-bottom:.8rem}
.dk .mt{border-color:#2a2a2a;color:#aaa}.mt b{color:inherit;font-weight:600}
.cb p{margin:0 0 1.1rem;font-size:.93rem;color:var(--mute);flex:1}.dk .cb p{color:#aaa}
.mr{font-weight:600;font-size:.9rem;color:var(--ink);border-bottom:2px solid var(--acc);align-self:flex-start}.dk .mr{color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:.8rem 1rem;align-items:center;justify-content:space-between;margin-bottom:2rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{font:500 .88rem var(--body);background:transparent;border:1px solid var(--g2);padding:.45rem .9rem;cursor:pointer;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #bdbdbd;padding:.7rem .8rem;width:100%}
.bar input,.bar select{width:auto;min-width:11rem;padding:.5rem .7rem}
.cnt{color:var(--mute);font-size:.9rem}
.fq{border-bottom:1px solid var(--g2)}.fq summary{cursor:pointer;list-style:none;padding:1.3rem 0;font:700 1.5rem/1.1 var(--disp);text-transform:uppercase;display:flex;justify-content:space-between;gap:1rem}
.fq summary::-webkit-details-marker{display:none}.fq summary::after{content:"+";color:var(--acc);font-size:1.8rem;line-height:1;transition:transform .3s}
.fq[open] summary::after{transform:rotate(45deg)}.fq p{margin:0 0 1.4rem;color:var(--mute);max-width:70ch}
.band{background:var(--acc);color:#0a0a0a;padding:clamp(3rem,8vw,5.5rem) 0;text-align:center}
.band h2{font-size:clamp(2rem,5vw,3.8rem);max-width:20ch;margin:0 auto 1rem}.band p{max-width:52ch;margin:0 auto 1.8rem}
.gcs{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem}.gcs a{border:1px solid var(--g2);padding:.5rem 1rem;text-decoration:none;font-weight:500;transition:background .2s,color .2s}
.gcs a:hover{background:var(--ink);color:#fff}
.gc{border:1px solid var(--g2);padding:1.6rem;background:#fff;display:flex;flex-direction:column;gap:.3rem;transition:border-color .3s,transform .3s}
.gc:hover{border-color:var(--acc);transform:translateY(-4px)}
.gc h3{font-size:1.8rem}.gc small{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:.8rem}
.gc a{text-decoration:none;border-bottom:1px solid var(--acc);align-self:flex-start}
.gl{display:flex;align-items:center;justify-content:center;height:96px;background:#fff;margin-bottom:1rem;padding:.8rem}.gc a.gl{border:1px solid var(--g2);align-self:stretch}.gl img{max-height:100%;max-width:100%;object-fit:contain}.gl:empty{display:none}.gl.dk2{background:#0a0a0a}.lm{height:44px;width:auto;display:block}.lf{width:170px;height:auto;display:block;margin-bottom:1.4rem}
.fm{display:grid;gap:1.1rem}.fm label{font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem}
.fm .er{color:#b3261e;font-size:.82rem;min-height:1.1em;display:block}
.fm [aria-invalid=true]{border-color:#b3261e}
.hp{position:absolute;left:-9999px}
.info{background:var(--ink);color:#fff;padding:2rem;display:grid;gap:1.6rem;align-content:start}
.info small{display:block;color:#aaa;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}
.info a{font:700 1.6rem var(--disp);text-decoration:none;word-break:break-all}.info a:hover{color:var(--acc)}
.ok{border:2px solid var(--acc);padding:1.6rem;margin-top:1rem}
.dt{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:start}
.dt .vs{aspect-ratio:4/3}.spec{border:1px solid var(--g2);padding:1.5rem;display:grid;gap:1rem}.spec small{display:block;color:var(--mute);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase}
.pn{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:2.5rem}
footer{background:var(--ink);color:#fff;padding:clamp(3rem,6vw,4.5rem) 0 1.5rem}
.fg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2rem}
footer h2{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:1.4rem}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}footer h3{font:600 .8rem var(--body);letter-spacing:.2em;text-transform:uppercase;color:#9a9a9a;margin-bottom:.7rem}
footer ul a{text-decoration:none;opacity:.85}footer ul a:hover{opacity:1;color:var(--acc)}
.lg{margin-top:2.5rem;padding-top:1.1rem;border-top:1px solid #2b2b2b;font-size:.85rem;color:#9a9a9a;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem}
.prog{position:fixed;top:0;left:0;width:100%;height:3px;background:#fff;mix-blend-mode:difference;transform:scaleX(0);transform-origin:0 50%;z-index:60}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.1,1);transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
.card.rv.in:hover{transform:translateY(-6px)}
.h3{font-size:1.9rem;letter-spacing:.01em}
.bk{font-weight:600;text-decoration:none;border-bottom:2px solid var(--acc)}
.dss{margin-top:3.5rem;border-top:1px solid var(--g2)}
.ds{display:grid;grid-template-columns:4rem 15rem 1fr;gap:1rem 2rem;padding:2rem 0;border-bottom:1px solid var(--g2);align-items:baseline}
.ds b{font:800 1.8rem var(--disp);color:var(--acc)}.ds p{margin:0;font-size:1.05rem;color:var(--mute)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:1rem}
.gi{position:relative;aspect-ratio:4/3;overflow:hidden;border:0;padding:0;cursor:zoom-in;background:#0f1419;color:#5d6b78}
.gi .bp{position:absolute;inset:auto 1rem 0;width:calc(100% - 2rem);height:70%}.gi .bp use{stroke:currentColor;fill:none}
.gi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.1,1)}.gi:hover img{transform:scale(1.06)}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center}.lb.o{display:flex}
.lb img{max-width:92vw;max-height:88vh;object-fit:contain}
.lb button{position:absolute;color:#fff;background:none;border:0;font-size:2.6rem;line-height:1;cursor:pointer;padding:1rem}
.lb .x{top:.5rem;right:1rem}.lb .pv{left:.5rem}.lb .nx{right:.5rem}
@media(max-width:820px){.ds{grid-template-columns:1fr;gap:.3rem}}
@media(max-width:820px){.mb{display:block}.nv ul{display:none;position:absolute;top:100%;left:0;right:0;background:#0a0a0a;flex-direction:column;align-items:flex-start;padding:1.5rem;gap:1.2rem}.nv.o ul{display:flex}.nv.o{background:#0a0a0a}.two,.dt{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important}.wd i{transform:none}.rv{opacity:1;transform:none}.scene{transform:none}}
</style>

var P=[["Retail Building", "Algood, TN", "Commercial Building", "A modern retail facility developed to provide flexible commercial space for a variety of retail and service-oriented businesses. The project focuses on creating a durable, accessible, and highly functional environment that supports tenant success while enhancing the surrounding commercial corridor.", "retail-building---algood-tn", "YEjRxKqZal4zaR0aMiooDc9lsE.jpeg", {"a": "9,840 sq ft", "c": "The objective was to create a versatile retail environment that balances visibility, accessibility, and long-term functionality. The design emphasizes open floor plans, prominent storefront exposure, and efficient customer circulation, allowing future tenants to adapt the space to their operational needs. Every aspect of the facility was planned to support both business performance and customer convenience.", "p": "The project follows a coordinated construction approach focused on structural efficiency, tenant flexibility, and long-term durability. From site preparation and utility coordination to structural erection and building enclosure, each phase is aligned with the project's commercial objectives. The layout is designed to accommodate a range of retail uses while maintaining efficient circulation, accessibility, and operational flow. Durable materials and reliable building systems are incorporated throughout the facility to support ongoing performance and ease of maintenance.", "o": "The retail building establishes a flexible commercial environment designed to support a variety of businesses and customer needs. The open layout, visible storefront presence, and adaptable interior spaces create opportunities for long-term tenant success while contributing to the continued growth of the Algood business community. The project provides a strong foundation for future retail activity and ongoing commercial development in the area.", "g": ["eu3b5XHZWRhl8IAjCzuwAUwtJZQ.jpeg", "8p9lRpJJcIhHsDTdvEyPHgfx8.jpeg", "zoQ3ssZ  broad product assortment and merchandising strategy. The layout emphasizes open retail floor space, clear circulation paths, and convenient access points for customers and inventory movement. The design supports both everyday shopping convenience and the operational demands of a large-format agricultural supply store.", "p": "The project follows a coordinated construction approach focused on structural efficiency and operational functionality. From site preparation through structural erection and interior build-out, each phase is aligned with the brand’s operational standards. The building layout organizes retail floor areas, storage zones, and support spaces to maintain smooth circulation and efficient product flow. Durable materials and reliable building systems are incorporated to support long-term performance.", "o": "The Tractor Supply Co. facility establishes a structured retail environment designed to support large-scale merchandising and consistent customer traffic. The open floor layout encourages efficient movement throughout the store while maintaining organized operational zones for staff and inventory management. The project expands Tractor Supply Co.’s retail presence while supporting the needs of customers in the DeFuniak Springs community.", "g": ["I4C3p8OuaDPEPo6NsiczNIYezs.jpg", "eSwghGNYtSIdSeHfsBmxChgBqo.jpg", "Glo6o3Y1KAHSVBbX2yrShcr3BQQ.jpg", "xHInRnKzafGRXFwd8HQDEXrOt3w.jpg", "0QMZiGQnZZ4VEVXqGPVQp3k92Zo.jpg", "dXFiHdnFTxrMlcFWAciHFamasY.jpg"]}], ["Tractor Supply Co. Store", "Lake City, FL", "Commercial Building", "A large-format retail facility developed to support Tractor Supply Co.’s wide range of agricultural, home improvement, and outdoor products. The project focuses on creating a durable and highly functional retail environment designed to accommodate steady customer traffic, large merchandise volumes, and efficient store operations.", "tractor-supply-co.-store-lake-city-fl", "M0I80F87VUNOYkpPcMsHJn92tk0.jpg", {"a": "21,930 sq ft", "c": "The objective was to develop a spacious and practical retail environment capable of supporting Tractor Supply Co.’s diverse product categories and merchandising strategy. The design emphasizes open floor areas, clear customer circulation, and convenient access points for both shoppers and inventory movement. The layout supports an organized shopping experience while meeting the operational demands of a large-format retail store.", "p": "The project follows a coordinated construction approach focused on structural efficiency and operational functionality. From site preparation through structural erection and interior build-out, each phase is aligned with the brand’s operational requirements. The building layout organizes retail floor space, storage areas, and service zones to maintain clear circulation and efficient product flow. Durable materials and building systems are incorporated to support long-term reliability and ease of maintenance.", "o": "The Tractor Supply Co. facility establishes a large, well-structured retail environment designed to support everyday shopping and agricultural supply needs. The expansive floor area encourages efficient customer movement while supporting flexible merchandising and staff workflow. The project strengthens Tractor Supply Co.’s presence in the Lake City community while supporting dependable day-to-day operations.", "g": ["TZun5dmZ4O3rJzfn9p0qhmV9Y.jpg", "l2iupjNIIToTA5jgYcMkKO9Zro.jpg", "y7KX11Y1xTIKa04nTEeyOxfuu6Y.jpg", "HKmsLKUwCZdKjjzq9gh1JZ9Ivc0.jpg", "X5KjUIWOIQaUYK3mHfRkwTE.jpg", "9khBzbKpMXhba6qjFousCr02epY.jpg"]}], ["Dollar Tree Retail Store", "Vermilion, SD", "Commercial Building", "A full commercial retail construction delivered for a national brand, built to meet strict Dollar Tree specifications while adapting to local site conditions. The project focused on efficiency, durability, and consistency with brand standards, resulting in a functional, customer-friendly retail space ready for high daily traffic.", "dollar-tree-retail-store-vermilion-sd", "gT3eIG0egGfIr78z7h5CMemRg.jpg", {"a": "10,000 sq ft", "c": "The objective was to deliver a turnkey retail space that aligned precisely with Dollar Tree’s corporate design standards while ensuring long-term durability and efficient customer flow. The layout prioritizes clear sightlines, optimized aisle spacing, and a welcoming storefront presence to support smooth operations and a consistent shopping experience.", "p": "Our team managed the project from site preparation through final build-out. The scope included structural work, envelope installation, interior framing, MEP coordination, and finish installation per brand requirements. Close coordination with inspectors, suppliers, and brand representatives ensured compliance with national standards, timelines, and quality expectations. Emphasis was placed on constructability, schedule control, and minimizing rework.", "o": "The Dollar Tree store delivers a clean, efficient, and durable retail environment ready for immediate operation. The space supports high customer volume, efficient stocking, and long-term performance. The project was completed to specification, providing the client with a reliable, brand-consistent store that serves the Vermilion community effectively.", "g": ["MLx4hIqoemdetwNuhAHtZGHYhQ.jpg", "dF79hXmzn92Wj0I8v0JN6euiYac.jpg", "KTckIPoT5H5TfprDJ5G86OC6qhE.jpg", "zK6cGOgNi9fq6cqgDkoSDTw6yTw.jpg", "w6EADgDD38zPrcZyHlKhwq47lt0.jpg", "gT3eIG0egGfIr78z7h5CMemRg.jpg"]}], ["Dollar Tree Retail Store", "Leavenworth, KS", "Commercial Building", "A ground-up retail store developed to meet Dollar Tree’s national brand standards while supporting efficient operations and convenient neighborhood shopping. The project focuses on delivering a practical and durable retail environment designed to accommodate consistent customer traffic and organized merchandising.", "dollar-tree-retail-store-leavenworth-ks", "f0fe9KJ2BZX1uyZkhZhFchFrI5g.jpg", {"a": "10,000 sq ft", "c": "The ob ndable neighborhood retail store that feels accessible, organized, and easy to navigate. The design prioritizes visibility, straightforward customer flow, and efficient back-of-house operations. Every element was guided by clarity and function — supporting quick visits, consistent merchandising, and reliable performance.", "p": "The project was executed through a structured, phased construction approach. Site preparation, structural erection, envelope installation, and interior build-out were completed in alignment with Dollar General specifications. The interior layout was carefully zoned to separate customer areas, stocking zones, and service spaces, ensuring smooth circulation and operational efficiency. Materials and systems were selected for durability, ease of maintenance, and compliance with local codes and corporate requirements.", "o": "The store delivers a clean, efficient, and resilient retail space ready for immediate operation. Clear sightlines, organized circulation, and a straightforward layout support both customer experience and staff workflow. The result is a reliable, brand-consistent Dollar General location that serves the Cairo community with everyday convenience and long-term functionality.", "g": ["ngkKIvKz830BzPmZqVLkm4V0GOw.jpg", "BYQszvufGd3HZPilaXKydx1Y34Q.jpg", "Y2jz2qwavctRdB7hY5MxQv0Ri8.jpg", "yqnKUPu69DdJzfLJZ6Nr7lIHxiE.jpg", "224gVGABI9qIcE4qSHSh4HKa7qU.jpg", "a0NYkoQT9ENykpFqrzQbpBYbPpY.jpg"]}], ["ALTEC Industrial & Service Facility", "University Park, IL", "Commercial Building", "A specialized industrial facility developed to support ALTEC’s equipment, service, and operational needs. The project focuses on creating a durable and efficient commercial environment capable of supporting demanding industrial workflows, equipment movement, and day-to-day business operations.", "altec-industrial-service-facility---university-park-il", "Vls6dRMB7HenZbxLIXkO60NaJg.jpeg", {"a": "16,000 sq ft", "c": "The objective was to create a functional, high-performance facility tailored to the operational demands of a specialized industrial environment. The design emphasizes open working areas, efficient vehicle and equipment circulation, and clearly defined operational zones. Flexibility and durability were central to creating a facility capable of adapting to ongoing service and operational requirements.", "p": "The project follows a coordinated construction approach focused on structural efficiency, operational functionality, and long-term performance. From site preparation and structural erection through building enclosure and interior build-out, each phase is organized around the facility’s specialized requirements. Work areas, equipment zones, storage, and support spaces are strategically arranged to promote safe movement and efficient workflow.", "o": "The ALTEC facility establishes a modern industrial environment designed around efficiency, durability, and operational flexibility. The organized layout provides the space needed for equipment, service activities, and daily operations while maintaining clear circulation throughout the facility. The project delivers a dependable commercial asset built to support ALTEC’s continued operations and future needs.", "g": ["li5SyPNiyXYIFf5ea9b5J5DMMPU.jpeg", "1UG3QBFbMxas3fIET0fbfqqMQg.jpeg", "Rk71FalsYa88QTV8Gyp2E1InLs.jpeg", "YAGi7kAVq3FFNwLTEGqhdvkUdQ.jpeg", "u2wNLHv3R9v6bFRCTKNXNmdbGZU.jpeg", "Vls6dRMB7HenZbxLIXkO60NaJg.jpeg"]}]];
